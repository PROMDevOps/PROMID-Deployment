apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: email-secret
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: k8s-secret-store      # name of the SecretStore (or kind specified)
  target:
    name: email-secret       # name of the k8s Secret to be created
  data:
  - secretKey: EMAIL_ID
    remoteRef:
      key: initial-secret
      property: EMAIL_ID

  - secretKey: EMAIL_KEY
    remoteRef:
      key: initial-secret
      property: EMAIL_KEY
