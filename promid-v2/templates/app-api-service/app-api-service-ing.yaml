apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-api-service-ing
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.org/client-max-body-size: 50m
spec:
  ingressClassName: nginx
  tls:
    - hosts:
      - {{ .Values.domainAppApiService }}
      secretName: app-api-service-cert
  rules:
    - host: {{ .Values.domainAppApiService }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: promid-v2-{{ .Values.envAlias }}-app-api-service
                port:
                  number: 80
